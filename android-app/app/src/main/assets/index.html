<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="MentalMap — Twoja mapa relacji w formie układu planetarnego. Określ bliskość swoich relacji.">
    <meta name="theme-color" content="#0a0a1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>MentalMap — Mapa Relacji</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=0.9.11">
</head>
<body>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.error('SW registration failed:', err));
            });
        }
    </script>

    <!-- Stars background layer -->
    <div id="stars-bg"></div>

    <!-- Main solar system view -->
    <div id="solar-system">
        <!-- Orbital rings -->
        <div class="orbit-ring" data-level="3"></div>
        <div class="orbit-ring" data-level="2"></div>
        <div class="orbit-ring" data-level="1"></div>
        <div class="orbit-ring" data-level="0"></div>

        <!-- Sun (You) -->
        <div id="sun">
            <div class="sun-core"></div>
            <div class="sun-glow"></div>
            <span class="sun-label">Ty</span>
        </div>

        <!-- Planets will be dynamically inserted here -->
        <div id="planets-container"></div>
    </div>

    <!-- Labels on a separate high z-index layer (outside solar-system for proper stacking) -->
    <div id="labels-container"></div>

    <!-- Level labels -->
    <div id="level-labels">
        <span class="level-label level-label--3">Poziom 3</span>
        <span class="level-label level-label--2">Poziom 2</span>
        <span class="level-label level-label--1">Poziom 1</span>
    </div>

    <!-- Ranking View -->
    <div id="ranking-view" class="hidden">
        <h2 class="ranking-title">Ranking Relacji</h2>
        <div id="ranking-list"></div>
    </div>

    <!-- Toggle View Button -->
    <button id="btn-toggle-view" class="btn-toggle-view">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="8" y1="6" x2="21" y2="6"></line>
            <line x1="8" y1="12" x2="21" y2="12"></line>
            <line x1="8" y1="18" x2="21" y2="18"></line>
            <line x1="3" y1="6" x2="3.01" y2="6"></line>
            <line x1="3" y1="12" x2="3.01" y2="12"></line>
            <line x1="3" y1="18" x2="3.01" y2="18"></line>
        </svg>
    </button>

    <!-- Floating Action Button -->
    <button id="fab-add" aria-label="Dodaj nową osobę">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <path d="M14 4V24M4 14H24" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
    </button>

    <!-- Survey Modal -->
    <div id="survey-modal" class="modal-overlay" aria-hidden="true">
        <div class="modal-container">
            <div class="modal-header">
                <h2 id="modal-title">Nowa relacja</h2>
                <button id="btn-cancel" class="btn-icon" aria-label="Zamknij">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <path d="M6 6L18 18M6 18L18 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>

            <form id="survey-form">
                <!-- Name input -->
                <div class="form-group name-group">
                    <label for="person-name" class="form-label">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" style="vertical-align: middle; margin-right: 6px;">
                            <circle cx="10" cy="7" r="4" stroke="currentColor" stroke-width="1.5" fill="none"/>
                            <path d="M2 18C2 14.5 5.5 12 10 12C14.5 12 18 14.5 18 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/>
                        </svg>
                        Imię i nazwisko
                    </label>
                    <input type="text" id="person-name" placeholder="np. Jan Kowalski" required autocomplete="off">
                </div>

                <!-- Color picker -->
                <div class="form-group color-group">
                    <label class="form-label">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" style="vertical-align: middle; margin-right: 6px;">
                            <path d="M10 2a8 8 0 100 16 8 8 0 000-16z" stroke="currentColor" stroke-width="1.5"/>
                            <path d="M10 2c3.5 0 6 3.5 6 7.5s-2.5 7.5-6 7.5c-3.5 0-4-3-4-7.5C6 5.5 6.5 2 10 2z" stroke="currentColor" stroke-width="1.5"/>
                        </svg>
                        Kolor planety
                    </label>
                    <div id="color-picker" class="color-picker">
                        <!-- Swatches injected by JS -->
                    </div>
                </div>

                <!-- Questions will be dynamically generated by app.js -->
                <div id="questions-container"></div>

                <!-- Score preview -->
                <div id="score-preview" class="score-preview">
                    <div class="score-preview__label">Wynik</div>
                    <div class="score-preview__value">
                        <span id="score-value">--</span><span class="score-preview__max">/36</span>
                    </div>
                    <div id="score-level" class="score-preview__level">Odpowiedz na wszystkie pytania</div>
                </div>

                <!-- Action buttons -->
                <div class="form-actions">
                    <button type="button" id="btn-delete" class="btn btn--delete" style="display: none;">
                        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" style="vertical-align: middle; margin-right: 4px;">
                            <path d="M3 5H15M6 5V3.5C6 2.67 6.67 2 7.5 2H10.5C11.33 2 12 2.67 12 3.5V5M7 8V13M11 8V13M4 5L5 15.5C5 16.33 5.67 17 6.5 17H11.5C12.33 17 13 16.33 13 15.5L14 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        Usuń
                    </button>
                    <button type="submit" id="btn-save" class="btn btn--save">
                        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" style="vertical-align: middle; margin-right: 4px;">
                            <path d="M4 9L7.5 12.5L14 5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        Zapisz
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Empty state message -->
    <div id="empty-state">
        <p>Dodaj swoją pierwszą relację</p>
        <p class="empty-state__hint">Kliknij <strong>+</strong> aby rozpocząć</p>
    </div>

    <div id="app-version">v0.9.11</div>
    <script src="app.js?v=0.9.11"></script>
</body>
</html>
