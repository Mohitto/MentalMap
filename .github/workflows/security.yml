name: Security scan

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Rules get updated even when the code does not; catch new findings weekly.
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  crypto-tests:
    name: Crypto tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Node's WebCrypto is the same SubtleCrypto implementation the browser
      # exposes, so these exercise the real primitives rather than a stand-in.
      # A silent break here would mean unreadable user data, so it must fail loud.
      - run: node tests/crypto.test.mjs

  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7

      # Public rulesets — no Semgrep account or SEMGREP_APP_TOKEN required.
      # p/xss is the one that earns its keep here: person names are user-typed
      # and reach innerHTML in several places.
      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/javascript \
            --config p/xss \
            --config p/secrets \
            --sarif --output semgrep.sarif \
            --metrics=off
        continue-on-error: true

      - name: Upload findings to GitHub code scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
